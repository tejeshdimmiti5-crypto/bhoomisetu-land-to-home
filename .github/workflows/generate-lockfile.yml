name: Generate Linux npm lockfile

on:
  workflow_dispatch:
  pull_request:
    branches: [fix/ci-baseline-2026-10]

permissions:
  contents: read

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Generate lockfile on Linux
        run: npm install
      - name: Verify lockfile with clean install
        run: npm ci
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: linux-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 3
