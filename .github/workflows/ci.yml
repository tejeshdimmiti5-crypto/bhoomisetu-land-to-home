name: CI

on:
  push:
    branches: [main, 'feat/**', 'fix/**']
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Geometry tests
        run: npm run test:geometry
      - name: Plot storage regression tests
        run: npm run test:plot-store
      - name: Floor plan regression tests
        run: npm run test:floor-plan
      - name: Plot fit regression tests
        run: npm run test:plot-fit
      - name: Design document regression tests
        run: npm run test:design-document
      - name: Estimate engine regression tests
        run: npm run test:estimate
      - name: Layout candidate regression tests
        run: npm run test:layout-candidates
      - name: Room openings regression tests
        run: npm run test:room-openings
      - name: Area unit regression tests
        run: npm run test:units
      - name: GPS capture regression tests
        run: npm run test:gps-capture
      - name: Editor session regression tests
        run: npm run test:editor-session
      - name: Type-check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
